<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Virtual Smartphone</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #1e272e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* ตัวเครื่องมือถือ */
        .phone {
            width: 375px; height: 780px;
            background: url('https://unsplash.com') center/cover;
            border: 12px solid #2f3640; border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* หน้าจอล็อค */
        .lock-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 1000; transition: 0.5s ease;
        }
        .lock-time { font-size: 56px; font-weight: 200; margin-bottom: 10px; }
        .lock-date { font-size: 18px; margin-bottom: 40px; opacity: 0.8; }
        .unlock-btn {
            background: rgba(255,255,255,0.3); color: white; border: 1px solid white;
            padding: 12px 28px; border-radius: 25px; font-size: 16px; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* หน้าจอหลัก (Home Screen) */
        .home-screen { padding: 25px 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; color: white; font-size: 11px; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .app-icon img { width: 55px; height: 55px; border-radius: 12px; margin-bottom: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); background: white; object-fit: cover; }

        /* หน้าต่างแอปภายใน */
        .app-window { position: absolute; top: 100%; left: 0; right: 0; bottom: 0; background: white; z-index: 500; transition: 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94); display: flex; flex-direction: column; }
        .app-window.active { top: 0; }
        .app-header { background: #f8f9fa; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; font-weight: bold; font-size: 16px; color: #333; }
        .back-btn { border: none; background: none; font-size: 20px; margin-right: 12px; cursor: pointer; color: #007aff; }

        /* --- สไตล์ของแต่ละแอป --- */
        /* LINE */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #abc1d1; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 16px; max-width: 75%; font-size: 14px; line-height: 1.4; }
        .msg.bot { background: white; align-self: flex-start; border-top-left-radius: 4px; }
        .msg.user { background: #fee500; align-self: flex-end; border-top-right-radius: 4px; }
        .chat-input { padding: 10px; display: flex; gap: 8px; background: white; border-top: 1px solid #ddd; }
        .chat-input input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .chat-input button { border: none; background: #fee500; padding: 0 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Instagram */
        .ig-body { flex: 1; overflow-y: auto; background: #fff; }
        .ig-post { border-bottom: 1px solid #efefef; margin-bottom: 10px; }
        .ig-post-header { display: flex; align-items: center; padding: 10px; font-weight: bold; font-size: 13px; }
        .ig-avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; background: #ccc; }
        .ig-img { width: 100%; height: 250px; object-fit: cover; }
        .ig-actions { padding: 10px; font-size: 18px; display: flex; gap: 15px; }
        .ig-likes { padding: 0 10px 5px; font-size: 13px; font-weight: bold; }
        .ig-caption { padding: 0 10px 10px; font-size: 13px; line-height: 1.4; }

        /* รายชื่อ */
        .contacts-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .contact-avatar { width: 40px; height: 40px; border-radius: 50%; background: #007aff; color: white; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px; }

        /* นาฬิกา */
        .clock-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; color: white; }
        .digital-clock { font-size: 48px; font-weight: bold; font-family: monospace; }
        .stopwatch-btn { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-top: 20px; cursor: pointer; }

        /* รูปภาพ */
        .gallery-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
        .gallery-item { width: 100%; height: 100px; object-fit: cover; cursor: pointer; transition: 0.2s; }
        .gallery-item:hover { opacity: 0.8; }

        /* กล้องถ่ายรูป */
        .camera-body { flex: 1; background: #000; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .camera-view { flex: 1; background: url('https://unsplash.com') center/cover; position: relative; }
        .camera-shutter-area { height: 100px; background: #000; display: flex; justify-content: center; align-items: center; }
        .shutter-btn { width: 65px; height: 65px; border-radius: 50%; background: white; border: 5px solid #333; cursor: pointer; }

        /* ปฏิทิน */
        .calendar-body { flex: 1; padding: 15px; background: #fff; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; margin-top: 15px; }
        .cal-day-head { font-weight: bold; color: #888; font-size: 12px; }
        .cal-day { padding: 8px 0; border-radius: 50%; font-size: 14px; cursor: pointer; }
        .cal-day.today { background: #ff3b30; color: white; font-weight: bold; }

        /* การตั้งค่า */
        .settings-body { flex: 1; background: #f2f2f7; overflow-y: auto; }
        .settings-group { background: white; margin-top: 20px; border-top: 1px solid #d1d1d6; border-bottom: 1px solid #d1d1d6; }
        .settings-item { display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #e5e5ea; font-size: 16px; color: #000; }
        .settings-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="phone">
        <!-- [1] หน้าจอล็อค -->
        <div class="lock-screen" id="lockScreen">
            <div class="lock-time" id="lockTime">12:00</div>
            <div class="lock-date">วันเสาร์ที่ 24 ตุลาคม</div>
            <button class="unlock-btn" onclick="unlockPhone()">🔓 ปลดล็อคหน้าจอ</button>
        </div>

        <!-- [2] หน้าจอหลัก (Home Screen) -->
        <div class="home-screen">
            <div class="app-icon" onclick="openApp('lineApp')">
                <img src="https://icons8.com"><span>LINE</span>
            </div>
            <div class="app-icon" onclick="openApp('youtubeApp')">
                <img src="https://icons8.com"><span>YouTube</span>
            </div>
            <div class="app-icon" onclick="openApp('igApp')">
                <img src="https://icons8.com"><span>Instagram</span>
            </div>
            <div class="app-icon" onclick="openApp('contactsApp')">
                <img src="https://icons8.com"><span>รายชื่อ</span>
            </div>
            <div class="app-icon" onclick="openApp('clockApp')">
                <img src="https://icons8.com"><span>นาฬิกา</span>
            </div>
            <div class="app-icon" onclick="openApp('galleryApp')">
                <img src="https://icons8.com"><span>รูปภาพ</span>
            </div>
            <div class="app-icon" onclick="openApp('cameraApp')">
                <img src="https://icons8.com"><span>กล้องถ่ายรูป</span>
            </div>
            <div class="app-icon" onclick="openApp('calendarApp')">
                <img src="https://icons8.com"><span>ปฏิทิน</span>
            </div>
            <div class="app-icon" onclick="openApp('settingsApp')">
                <img src="https://icons8.com"><span>การตั้งค่า</span>
            </div>
        </div>

        <!-- --- หน้าต่างแอปย่อยต่างๆ --- -->

        <!-- LINE -->
        <div class="app-window" id="lineApp">
            <div class="app-header"><button class="back-btn" onclick="closeApp('lineApp')">⬅</button>LINE แชทบอท</div>
            <div class="chat-box" id="chatBox"><div class="msg bot">สวัสดี! พิมพ์คุยกับเราได้เลยนะ 💬</div></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="พิมพ์ข้อความ...">
                <button onclick="sendMessage()">ส่ง</button>
            </div>
        </div>

        <!-- YouTube -->
        <div class="app-window" id="youtubeApp">
            <div class="app-header"><button class="back-btn" onclick="closeApp('youtubeApp')">⬅</button>YouTube</div>
            <iframe width="100%" height="210" src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
