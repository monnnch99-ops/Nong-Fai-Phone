<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 16 Ultimate Simulator - Final Fixed</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: #1e272e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* 📱 ตัวเครื่อง iPhone 16 */
        .phone {
            width: 375px; height: 780px;
            background: url('https://unsplash.com') center/cover;
            border: 12px solid #111; border-radius: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* 🔘 Dynamic Island */
        .dynamic-island {
            position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
            width: 110px; height: 25px; background: black; border-radius: 20px;
            z-index: 2000;
        }

        /* 📶 แถบสถานะด้านบน */
        .status-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 40px;
            padding: 13px 24px 0 24px; display: flex; justify-content: space-between;
            align-items: center; color: white; font-size: 12px; font-weight: 600; z-index: 1500;
        }
        .status-right { display: flex; align-items: center; gap: 6px; }

        /* 🔒 หน้าจอล็อก (Lock Screen) */
        .lock-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://unsplash.com') center/cover;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            color: white; z-index: 1000; transition: transform 0.6s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            padding-top: 60px;
        }
        
        /* คลาสปลดล็อกที่แก้ไขระบบเคลื่อนไหวให้เสถียรที่สุด */
        .lock-screen.unlocked { transform: translateY(-100%) !important; opacity: 0; pointer-events: none; }
        
        .lock-content { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .lock-time { font-size: 72px; font-weight: 200; margin-bottom: 2px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); cursor: pointer; }
        .lock-date { font-size: 19px; margin-bottom: 30px; font-weight: 400; opacity: 0.95; }
        
        .passcode-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .passcode-label { font-size: 14px; margin-bottom: 15px; letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        
        .dots-container { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 12px; height: 12px; border: 1.5px solid white; border-radius: 50%; transition: 0.1s; }
        .dot.active { background: white; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 25px; justify-items: center; width: 260px; }
        .key-btn {
            width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.18);
            color: white; border: 1px solid rgba(255,255,255,0.1); font-size: 24px; font-weight: 400;
            display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none;
            backdrop-filter: blur(8px); -webkit-tap-highlight-color: transparent; transition: background 0.1s;
        }
        .key-btn:active { background: rgba(255,255,255,0.45); }
        .key-action-btn { font-size: 14px; background: none; border: none; color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; outline: none; }

        /* 🏠 หน้าจอหลัก */
        .main-screen-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 50px 15px 15px 15px; }
        .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; overflow-y: auto; padding-bottom: 10px; }
        .app-icon { display: flex; flex-direction: column; align-items: center; color: white; font-size: 11px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
        .app-icon img { width: 55px; height: 55px; border-radius: 13px; margin-bottom: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background: white; object-fit: cover; }
        
        .bottom-dock {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px);
            border-radius: 26px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 5px;
        }

        .app-window { position: absolute; top: 100%; left: 0; right: 0; bottom: 0; background: white; z-index: 900; transition: 0.3s ease-out; display: flex; flex-direction: column; padding-top: 40px; }
        .app-window.active { top: 0; }
        .app-header { background: #f8f9fa; padding: 12px 15px; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; font-weight: bold; font-size: 16px; color: #333; }
        .back-btn { border: none; background: none; font-size: 20px; margin-right: 12px; cursor: pointer; color: #007aff; }

        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #abc1d1; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 9px 13px; border-radius: 16px; max-width: 75%; font-size: 14px; }
        .msg.bot { background: white; align-self: flex-start; }
        .msg.user { background: #fee500; align-self: flex-end; }
        .chat-input { padding: 10px; display: flex; gap: 8px; background: white; border-top: 1px solid #ddd; }
        .chat-input input { flex: 1; padding: 8px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .chat-input button { border: none; background: #fee500; padding: 0 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        .calc-screen { background: #000; color: white; text-align: right; padding: 20px; font-size: 40px; font-family: monospace; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: #000; flex: 1; }
        .calc-btn { background: #333; color: white; border: none; font-size: 22px; border-radius: 50%; height: 60px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .calc-btn.orange { background: #ff9f0a; }
        .calc-btn.gray { background: #a5a5a5; color: black; }

        .notes-area { flex: 1; padding: 15px; border: none; outline: none; font-size: 16px; resize: none; background: #fffdf3; }
        .weather-body { flex: 1; background: linear-gradient(to bottom, #5ac8fa, #5085a5); color: white; padding: 30px; text-align: center; }
        .map-body { flex: 1; background: #e5e3df url('https://icons8.com') center/no-repeat; background-size: 100px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
    </style>
</head>
<body>

    <div class="phone">
        <div class="status-bar">
            <span id="statusTime">12:00</span>
            <div class="status-right"><span>📶</span><span>5G</span><span>🔋</span></div>
        </div>

        <div class="dynamic-island"></div>

        <!-- 🔒 หน้าจอล็อก -->
        <div class="lock-screen" id="lockScreen" style="didplay: none;">
            <div class="lock-content">
                <!-- 🌟 ทางลัดลับ: จิ้มที่ตัวเลขเวลาดวงโตๆ ตรงนี้ 1 ที หน้าจอจะปลดล็อกทันทีเพื่อแก้ปัญหาระบบค้าง! -->
                <div class="lock-time" id="lockTime" onclick="forceUnlock()">12:00</div>
                <div class="lock-date" id="lockDate">วันเสาร์ที่ 24 ตุลาคม</div>
                
                <div class="passcode-container">
                    <div class="passcode-label" id="passcodeLabel">ป้อนรหัสผ่านเพื่อเปิดใช้งาน<
                    <div class="dots-container">
                        <div class="dot" id="dot0"></div>
                        <div class="dot" id="dot1"></div>
                        <div class="dot" id="dot2"></div>
                        <div class="dot" id="dot3"></div>
                    </div>
                    
                    <div class="keypad">
                        <button class="key-btn" onclick="pressKey('1')">1</button>
                        <button class="key-btn" onclick="pressKey('2')">2</button>
                        <button class="key-btn" onclick="pressKey('3')">3</button>
                        <button class="key-btn" onclick="pressKey('4')">4</button>
                        <button class="key-btn" onclick="pressKey('5')">5</button>
                        <button class="key-btn" onclick="pressKey('6')">6</button>
                        <button class="key-btn" onclick="pressKey('7')">7</button>
                        <button class="key-btn" onclick="pressKey('8')">8</button>
                        <button class="key-btn" onclick="pressKey('9')">9</button>
                        <button class="key-action-btn" disabled></button>
                        <button class="key-btn" onclick="pressKey('0')">0</button>
                        <button class="key-action-btn" onclick="deleteKey()">ลบ</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 🏠 หน้าจอหลัก -->
        <div class="main-screen-container">
            <div class="apps-grid">
                <div class="app-icon" onclick="openApp('lineApp')">
                    <img src="https://icons8.com"><span>LINE</span>
                </div>
                <div class="app-icon" onclick="openApp('weatherApp')">
                    <img src="https://icons8.com"><span>สภาพอากาศ</span>
                </div>
                <!-- 🧠 ใส่โค้ดสมองควบคุม (JavaScript) กลับเข้าไปตรงนี้ -->
    <script>
        // 🔐 ตั้งรหัสผ่านเข้าเครื่องตรงนี้
        const CORRECT_PASSCODE = "1234"; 
        let enteredPasscode = "";

        // ฟังก์ชันทำงานเมื่อกดปุ่มตัวเลขหน้าล็อคสกรีน
        function pressKey(num) {
            if (enteredPasscode.length >= 4) return;
            enteredPasscode += num;
            updatePasscodeDots();
            
            // เมื่อกดครบ 4 หลัก ทำการเช็ครหัสผ่านทันที
            if (enteredPasscode.length === 4) {
                setTimeout(() => {
                    if (enteredPasscode === CORRECT_PASSCODE) {
                        // รหัสถูก -> สั่งปิดหน้าจอล็อกทิ้งทันทีเพื่อเข้าหน้าหลักชัวร์ๆ
                        document.getElementById('lockScreen').style.display = 'none'; 
                    } else {
                        // รหัสผิด -> สั่นเตือนสีแดงแล้วล้างข้อความ
                        document.getElementById('passcodeLabel').innerText = "รหัสผิด! ลองใหม่อีกครั้ง";
                        document.getElementById('passcodeLabel').style.color = "#ff3b30";
                        enteredPasscode = "";
                        updatePasscodeDots();
                        setTimeout(() => {
                            document.getElementById('passcodeLabel').innerText = "ป้อนรหัสผ่านเพื่อเปิดใช้งาน (รหัส: 1234)";
                            document.getElementById('passcodeLabel').style.color = "white";
                        }, 1200);
                    }
                }, 200);
            }
        }

        // ฟังก์ชันลบตัวเลข
        function deleteKey() {
            if (enteredPasscode.length > 0) {
                enteredPasscode = enteredPasscode.slice(0, -1);
                updatePasscodeDots();
            }
        }

        // ฟังก์ชันจุดวงกลมรหัสผ่าน
        function updatePasscodeDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(dot${i});
                if (dot) {
                    if (i < enteredPasscode.length) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                }
            }
        }

        // ฟังก์ชันระบบ เปิด-ปิด แอปในหน้าจอหลัก
        function openApp(appId) { document.getElementById(appId).classList.add('active'); }
        function closeApp(appId) { document.getElementById(appId).classList.remove('active'); }

        // ระบบอัปเดตเวลาจริงอ้างอิงจากมือถือไอโฟน 16
        function updateClock() {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            document.getElementById('lockTime').innerText = timeStr;
            document.getElementById('statusTime').innerText = timeStr;
            
            const days = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            document.getElementById('lockDate').innerText = ${days[now.getDay()]}ที่ ${now.getDate()} ${months[now.getMonth()]};

            if(document.getElementById('appClock')) {
                document.getElementById('appClock').innerText = timeStr + ':' + String(now.getSeconds()).padStart(2, '0');
            }
        }
        setInterval(updateClock, 1000); updateClock();

        // ระบบโต้ตอบแอป LINE
        function sendLineMessage() {
            const input = document.getElementById('lineInput'); const chatBox = document.getElementById('lineChatBox');
            if (!input.value.trim()) return;
            const msg = document.createElement('div'); msg.className = 'msg user'; msg.innerText = input.value;
            chatBox.appendChild(msg); const text = input.value; input.value = ''; chatBox.scrollTop = chatBox.scrollHeight;
            setTimeout(() => {
                const reply = document.createElement('div'); reply.className = 'msg bot';
                if(text.includes('สวัสดี')) reply.innerText = 'สวัสดีค่า ยินดีที่ได้คุยกันนะคะ! 💚';
                else reply.innerText = 'รับทราบข้อความจ้า! มีอะไรให้ช่วยอีกไหมคะ? ✨';
                chatBox.appendChild(reply); chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

        // ระบบแอปเครื่องคิดเลข
        let calcVal = '';
        function pressCalc(num) { calcVal += num; document.getElementById('calcScreen').innerText = calcVal; }
        function clearCalc() { calcVal = ''; document.getElementById('calcScreen').innerText = '0'; }
        function calculateResult() {
            try {
                let res = eval(calcVal);
                document.getElementById('calcScreen').innerText = res; calcVal = String(res);
            } catch {
                document.getElementById('calcScreen').innerText = 'Error'; calcVal = '';
            }
        }
    </script>
