<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>มือถือของฉัน</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        /* กรอบมือถือ */
        .phone {
            width: 360px;
            height: 740px;
            background: url('https://picsum.photos') center/cover; /* รูปวอลเปเปอร์ */
            border: 12px solid #000;
            border-radius: 36px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        /* หน้าจอล็อค */
        .lock-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: 0.5s;
            z-index: 10;
        }
        .time { font-size: 48px; font-weight: bold; margin-bottom: 20px; }
        .unlock-btn {
            background: white; color: black; border: none;
            padding: 10px 20px; border-radius: 20px; font-size: 16px; cursor: pointer;
        }
        /* หน้าจอโฮม */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 40px;
        }
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }
        .app-icon img {
            width: 50px; height: 50px;
            border-radius: 12px; margin-bottom: 5px;
            background: white;
        }
    </style>
</head>
<body>

    <div class="phone">
        <!-- หน้าจอล็อค -->
        <div class="lock-screen" id="lockScreen">
            <div class="time">12:34</div>
            <button class="unlock-btn" onclick="unlockPhone()">คลิกเพื่อปลดล็อค</button>
        </div>

        <!-- หน้าจอหลักด้านใน -->
        <div class="apps-grid">
            <div class="app-icon" onclick="alert('แอปแชทเปิดแล้ว!')">
                <img src="https://icons8.com" alt="Chat">
                <span>ข้อความ</span>
            </div>
            <div class="app-icon" onclick="alert('คลังภาพยังไม่มีรูปจ้า')">
                <img src="https://icons8.com" alt="Photos">
                <span>รูปภาพ</span>
            </div>
        </div>
    </div>

    <script>
        // ฟังก์ชันปลดล็อคหน้าจอ
        function unlockPhone() {
            document.getElementById('lockScreen').style.top = '-100%';
        }
    </script>
</body>
</html>
