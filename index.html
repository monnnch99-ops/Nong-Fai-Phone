<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 16 Simulator</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: #1e272e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* ตัวเครื่อง iPhone 16 */
        .phone {
            width: 375px; height: 780px;
            background: url('https://unsplash.com') center/cover;
            border: 12px solid #111; border-radius: 45px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Dynamic Island แบบ iPhone 16 */
        .dynamic-island {
            position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
            width: 110px; height: 25px; background: black; border-radius: 20px;
            z-index: 2000; transition: 0.3s ease-in-out;
        }

        /* แถบสถานะด้านบน (Status Bar) */
        .status-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 40px;
            padding: 13px 24px 0 24px; display: flex; justify-content: space-between;
            align-items: center; color: white; font-size: 12px; font-weight: 600; z-index: 1500;
        }
        .status-right { display: flex; align-items: center; gap: 5px; }

        /* หน้าจอล็อค */
        .lock-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 1000; transition: 0.5s ease;
        }
        .lock-time { font-size: 64px; font-weight: 200; margin-top: 40px; }
        .lock-date { font-size: 18px; margin-bottom: 40px; opacity: 0.9; }
        .unlock-btn {
            background: rgba(255,255,255,0.25); color: white; border: none;
            padding: 12px 30px; border-radius: 25px; font-size: 15px; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* หน้าจอหลัก (Home Screen) */
        .main-screen-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 50px 15px 15px 15px; }
        .apps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; overflow-y: auto; padding-bottom: 10px; }
        
        /* แถบ Dock ด้านล่างสุด */
        .bottom-dock {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px);
            border-radius: 26px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); margin-bottom: 5px;
        }

        /* สไตล์ไอคอนแอป */
        .app-icon { display: flex; flex-direction: column; align-items: center; color: white; font-size: 11px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
        .app-icon img { width: 55px; height: 55px; border-radius: 13px; margin-bottom: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); background: white; object-fit: cover; }

        /* หน้าต่างแอปภายใน */
        .app-window { position: absolute; top: 100%; left: 0; right: 0; bottom: 0; background: white; z-index: 900; transition: 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94); display: flex; flex-direction: column; padding-top: 40px; }
        .app-window.active { top: 0; }
        .app-header { background: #f8f9fa; padding: 12px 15px; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; font-weight: bold; font-size: 16px; color: #333; }
        .back-btn { border: none; background: none; font-size: 20px; margin-right: 12px; cursor: pointer; color: #007aff; }

        /* --- ฟังก์ชั่นสไตล์ภายในแอปใหม่ --- */
        /* LINE & ข้อความ */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; background: #abc1d1; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 9px 13px; border-radius: 16px; max-width: 75%; font-size: 14px; }
        .msg.bot { background: white; align-self: flex-start; }
        .msg.user { background: #fee500; align-self: flex-end; }
        .chat-input { padding: 10px; display: flex; gap: 8px; background: white; border-top: 1px solid #ddd; }
        .chat-input input { flex: 1; padding: 8px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .chat-input button { border: none; background: #fee500; padding: 0 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* เครื่องคิดเลข */
        .calc-screen { background: #000; color: white; text-align: right; padding: 20px; font-size: 40px; font-family: monospace; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: #000; flex: 1; }
        .calc-btn { background: #333; color: white; border: none; font-size: 22px; border-radius: 50%; height: 60px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .calc-btn.orange { background: #ff9f0a; }
        .calc-btn.gray { background: #a5a5a5; color: black; }

        /* โน้ต */
        .notes-area { flex: 1; padding: 15px; border: none; outline: none; font-size: 16px; resize: none; background: #fffdf3; }

        /* สภาพอากาศ */
        .weather-body { flex: 1; background: linear-gradient(to bottom, #5ac8fa, #5085a5); color: white; padding: 30px; text-align: center; }

        /* แผนที่ */
        .map-body { flex: 1; background: #e5e3df url('https://icons8.com') center/no-repeat; background-size: 100px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
    </style>
</head>
<body>

                </div>
            </div>
        </div>

        <!-- --- ระบบภายในแอปพลิเคชัน --- -->

        <!-- LINE -->
        <div class="app-window" id="lineApp">
